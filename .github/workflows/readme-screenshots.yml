name: README screenshots (real Chromium)
on:
  push:
    branches: [docs/readme-visual-guide-20261106]
    paths:
      - README.md
      - scripts/docs/**
      - .github/workflows/readme-screenshots.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install documentation dependencies
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.56.1
          npx playwright install --with-deps chromium
          python3 -m pip install --user Pillow
      - name: Capture screenshots and annotate real DOM positions
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/gantt-docs-server.log 2>&1 &
          sleep 2
          node scripts/docs/capture-screenshots.cjs
          python3 scripts/docs/annotate-screenshots.py
      - name: Check screenshots and README links
        run: |
          python3 - <<'PY'
          import pathlib,re
          from PIL import Image
          root=pathlib.Path('docs/images/readme')
          images=list(root.glob('*.webp'))
          assert len(images)==17,len(images)
          for file in images:
              with Image.open(file) as image:image.verify()
          readme=pathlib.Path('README.md').read_text()
          links=re.findall(r'!\[[^\]]+\]\((docs/images/readme/[^)]+)\)',readme)
          assert len(links)>=15,len(links)
          for file in links:assert pathlib.Path(file).is_file(),file
          print('OK:',len(images),'Bilder und',len(links),'Bildverweise')
          PY
      - name: Check real export interactions in Chromium
        run: |
          mkdir -p visual-review
          npx playwright test tests/export-format-labels.spec.cjs tests/print-image.spec.cjs --workers=1 --reporter=line
      - name: Commit generated documentation images
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/readme
          if ! git diff --cached --quiet; then
            git commit -m "docs: include verified Chromium images and annotations"
            git push origin HEAD:"$BRANCH_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: gantt-readme-contact-sheet
          path: docs/images/readme/
          retention-days: 14
