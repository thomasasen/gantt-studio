name: Export format smoke
on:
  pull_request:
    branches: [main]
    paths:
      - index.html
      - assets/js/print/**
      - tests/export-format-labels.spec.cjs
      - .github/workflows/export-format-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check export UI syntax
        run: |
          node --check assets/js/print/print-ui.mjs
          node --check tests/export-format-labels.spec.cjs
      - name: Install minimal Playwright dependency
        run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - name: Install Chromium without unnecessary full-system dependency refresh
        run: npx playwright install chromium
      - name: Verify export format UI states
        run: npx playwright test tests/export-format-labels.spec.cjs --workers=1 --reporter=line
