name: Apply phase row click v1.4.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-phase-row-click-v143.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make phase summary rows clickable
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('assets/js/app.js')
          s = app.read_text()
          s = s.replace("import { renderGantt } from './gantt.js';", "import { renderGantt } from './gantt.js?v=1.4.3';")
          old = "  $('ganttStage').addEventListener('click', e => { if (Date.now() < (window.__ganttDragUntil || 0)) return; const node = e.target.closest('[data-task-id]'); const id=node?.dataset.taskId; if (id && !id.startsWith('phase-summary-')) openTaskDialog(id); });"
          new = "  $('ganttStage').addEventListener('click', e => { if (Date.now() < (window.__ganttDragUntil || 0)) return; const phaseRow=e.target.closest('[data-phase-id]'); const phaseId=phaseRow?.dataset.phaseId; if(phaseId){ collapsedPhases.has(phaseId)?collapsedPhases.delete(phaseId):collapsedPhases.add(phaseId); saveViewState(); renderPhaseToolbar(); renderGanttOnly(); return; } const node=e.target.closest('[data-task-id]'); const id=node?.dataset.taskId; if(id) openTaskDialog(id); });\n  $('ganttStage').addEventListener('keydown', e => { if(!['Enter',' '].includes(e.key)) return; const phaseRow=e.target.closest('[data-phase-id]'); const phaseId=phaseRow?.dataset.phaseId; if(!phaseId)return; e.preventDefault(); collapsedPhases.has(phaseId)?collapsedPhases.delete(phaseId):collapsedPhases.add(phaseId); saveViewState(); renderPhaseToolbar(); renderGanttOnly(); });"
          if old not in s:
              raise SystemExit('Expected ganttStage click handler not found')
          s = s.replace(old, new)
          app.write_text(s)

          gantt = Path('assets/js/gantt.js')
          s = gantt.read_text()
          old = "    const synthetic=task.syntheticPhase===true,rowL=el('div',`task-row-left${synthetic?' phase-summary-row':''}`);if(!synthetic)rowL.dataset.taskId=task.id;const title=el('div','task-title');"
          new = "    const synthetic=task.syntheticPhase===true,rowL=el('div',`task-row-left${synthetic?' phase-summary-row':''}`);if(synthetic){rowL.dataset.phaseId=String(task.phaseId);rowL.setAttribute('role','button');rowL.tabIndex=0;rowL.setAttribute('aria-expanded',String(!task.collapsed));rowL.title='Phase ein- oder ausklappen';}else rowL.dataset.taskId=task.id;const title=el('div','task-title');"
          if old not in s:
              raise SystemExit('Expected phase summary row renderer not found')
          s = s.replace(old, new)
          gantt.write_text(s)

          css = Path('assets/css/odin.css')
          s = css.read_text()
          marker = '/* Clickable phase rows v1.4.3 */'
          if marker not in s:
              s += "\n\n/* Clickable phase rows v1.4.3 */\n.phase-summary-row[data-phase-id]{cursor:pointer}\n"
          css.write_text(s)

          index = Path('index.html')
          s = index.read_text().replace('?v=1.4.2', '?v=1.4.3')
          index.write_text(s)
          PY
      - name: Validate patch
        run: |
          grep -q "gantt.js?v=1.4.3" assets/js/app.js
          grep -q "dataset.phaseId" assets/js/gantt.js
          grep -q "Clickable phase rows v1.4.3" assets/css/odin.css
          grep -q "app.js?v=1.4.3" index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/app.js assets/js/gantt.js assets/css/odin.css index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Make Gantt phase rows clickable'
          git push
