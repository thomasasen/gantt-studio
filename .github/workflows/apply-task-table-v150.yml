name: Apply Odin task table v1.5.0

# retrigger
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-task-table-v150.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add Aufgaben und Abhängigkeiten
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          h = index.read_text()

          if 'task-table.css?v=1.5.0' not in h:
              anchor = '  <link rel="stylesheet" href="./assets/css/scroll-fix.css?v=1.4.5">\n'
              if anchor not in h:
                  raise SystemExit('stylesheet anchor missing')
              h = h.replace(anchor, anchor + '  <link rel="stylesheet" href="./assets/css/task-table.css?v=1.5.0">\n')

          task_section = '''
      <section id="taskOverviewPanel" class="task-overview-panel panel" aria-labelledby="taskOverviewTitle">
        <div class="task-overview-header">
          <div>
            <h2 id="taskOverviewTitle">Aufgaben &amp; Abhängigkeiten</h2>
            <p>Termine, Status und Vorgänger zentral verwalten. Zellen anklicken, um Werte direkt zu bearbeiten.</p>
          </div>
          <div class="task-overview-actions">
            <button id="taskTableAddBtn" class="btn primary" type="button"><span aria-hidden="true">＋</span> Neue Aufgabe</button>
            <button id="taskDetailsToggle" class="btn task-details-toggle" type="button" aria-controls="taskOverviewTable" aria-expanded="false"><span aria-hidden="true">▸</span> Details anzeigen</button>
          </div>
        </div>
        <div class="task-table-wrap">
          <table id="taskOverviewTable" class="task-overview-table task-details-collapsed">
            <thead>
              <tr>
                <th>Aufgabe</th>
                <th class="task-detail-column">Phase</th>
                <th class="task-detail-column">Typ</th>
                <th>Zeitraum</th>
                <th>Fortschritt</th>
                <th>Verantwortlich</th>
                <th>Status</th>
                <th class="task-detail-column">Risiko</th>
                <th class="task-detail-column">Kosten</th>
                <th class="task-detail-column">Vorgänger</th>
                <th>Aktionen</th>
              </tr>
            </thead>
            <tbody id="taskTableBody"></tbody>
          </table>
        </div>
      </section>
'''
          if 'id="taskOverviewPanel"' not in h:
              anchor = '        <div class="gantt-scroller" id="ganttScroller"><div class="gantt-stage" id="ganttStage" role="region" aria-label="Gantt-Diagramm"></div></div>\n      </section>\n    </section>\n\n    <section id="planningView"'
              repl = '        <div class="gantt-scroller" id="ganttScroller"><div class="gantt-stage" id="ganttStage" role="region" aria-label="Gantt-Diagramm"></div></div>\n      </section>\n' + task_section + '    </section>\n\n    <section id="planningView"'
              if anchor not in h:
                  raise SystemExit('project view anchor missing')
              h = h.replace(anchor, repl)

          h = h.replace('assets/js/app.js?v=1.4.4', 'assets/js/app.js?v=1.5.0')
          index.write_text(h)

          app = Path('assets/js/app.js')
          s = app.read_text()

          if 'let taskDetailsExpanded' not in s:
              s = s.replace("let activeTab = 'project';", "let activeTab = 'project';\nlet taskDetailsExpanded = false;")

          bind_anchor = "  $('addTaskBtn').addEventListener('click', () => openTaskDialog());\n"
          bind_code = """  $('addTaskBtn').addEventListener('click', () => openTaskDialog());
  $('taskTableAddBtn').addEventListener('click', () => openTaskDialog());
  $('taskDetailsToggle').addEventListener('click', toggleTaskDetails);
  $('taskTableBody').addEventListener('click', handleTaskTableClick);
  $('taskTableBody').addEventListener('keydown', handleTaskTableKeydown);
"""
          if "$('taskTableAddBtn')" not in s:
              if bind_anchor not in s:
                  raise SystemExit('bind anchor missing')
              s = s.replace(bind_anchor, bind_code)

          old_render = "  renderMeta(); renderMetrics(); renderPlanningLists(); syncSettings(); renderQuickSettings(); renderPhaseToolbar(); renderGanttOnly(); populateTaskPhases(); syncControlStates();"
          new_render = "  renderMeta(); renderMetrics(); renderPlanningLists(); syncSettings(); renderQuickSettings(); renderPhaseToolbar(); renderGanttOnly(); renderTaskTable(); populateTaskPhases(); syncControlStates();"
          if 'renderTaskTable(); populateTaskPhases()' not in s:
              if old_render not in s:
                  raise SystemExit('renderAll anchor missing')
              s = s.replace(old_render, new_render)

          old_timeline = "  sortTasks(); touch(); await persist(); renderMetrics(); renderPhaseToolbar(); renderGanttOnly();\n}"
          new_timeline = "  sortTasks(); touch(); await persist(); renderMetrics(); renderPhaseToolbar(); renderGanttOnly(); renderTaskTable();\n}"
          if 'renderGanttOnly(); renderTaskTable();' not in s:
              if old_timeline not in s:
                  raise SystemExit('timeline update anchor missing')
              s = s.replace(old_timeline, new_timeline, 1)

          table_code = r'''
function toggleTaskDetails(){
  taskDetailsExpanded=!taskDetailsExpanded;
  renderTaskTable();
}

function renderTaskTable(){
  const table=$('taskOverviewTable'), body=$('taskTableBody'), toggle=$('taskDetailsToggle');
  if(!table||!body||!toggle)return;
  table.classList.toggle('task-details-collapsed',!taskDetailsExpanded);
  toggle.setAttribute('aria-expanded',String(taskDetailsExpanded));
  toggle.innerHTML=`<span aria-hidden="true">${taskDetailsExpanded?'▾':'▸'}</span> ${taskDetailsExpanded?'Details ausblenden':'Details anzeigen'}`;

  const tasks=envelope.project.tasks;
  if(!tasks.length){
    body.innerHTML='<tr><td colspan="11" class="task-table-empty">Noch keine Aufgaben vorhanden.</td></tr>';
    return;
  }
  const phaseMap=new Map((envelope.project.planning?.phases||[]).map(p=>[String(p.id),p.name]));
  const taskMap=new Map(tasks.map(t=>[String(t.id),t.name]));
  body.innerHTML=tasks.map(task=>{
    const dependencies=(task.dependencies||[]).map(id=>taskMap.get(String(id))||id).join(', ');
    const phase=phaseMap.get(String(task.phaseId||''))||'–';
    const note=task.notes?`<small class="task-table-note">${esc(task.notes)}</small>`:'';
    const link=task.url?`<a class="task-table-document" href="${esc(task.url)}" target="_blank" rel="noopener noreferrer">↗ Dokument</a>`:'';
    const baseline=task.baselineStart&&task.baselineEnd?`<small class="task-table-baseline">Soll: ${formatDate(task.baselineStart)} – ${formatDate(task.baselineEnd)}</small>`:'';
    return `<tr data-task-row-id="${esc(task.id)}">
      <td class="task-inline-cell" data-task-field="name" tabindex="0"><strong>${esc(task.name)}</strong>${note}${link}</td>
      <td class="task-detail-column task-inline-cell" data-task-field="phaseId" tabindex="0">${esc(phase)}</td>
      <td class="task-detail-column task-inline-cell" data-task-field="type" tabindex="0"><span class="task-type-badge task-type-${esc(task.type)}">${esc(taskTypeLabel(task.type))}</span></td>
      <td class="task-inline-cell task-period-cell" data-task-field="period" tabindex="0">${formatDate(task.start)} – ${formatDate(task.end)}${baseline}</td>
      <td class="task-inline-cell" data-task-field="progress" tabindex="0"><div class="task-progress-cell"><span class="task-progress-track"><i style="width:${clamp(Number(task.progress)||0,0,100)}%"></i></span><b>${clamp(Number(task.progress)||0,0,100)} %</b></div></td>
      <td class="task-inline-cell" data-task-field="owner" tabindex="0">${task.owner?esc(task.owner):'<span class="muted">–</span>'}</td>
      <td class="task-inline-cell" data-task-field="status" tabindex="0"><span class="task-status"><i class="task-status-dot ${esc(task.status||'neutral')}"></i>${esc(taskStatusLabel(task.status))}</span></td>
      <td class="task-detail-column task-inline-cell" data-task-field="risk" tabindex="0"><span class="task-risk task-risk-${esc(task.risk||'none')}">${esc(taskRiskLabel(task.risk))}</span></td>
      <td class="task-detail-column task-inline-cell" data-task-field="costEur" tabindex="0">${formatMoney(task.costEur||0)}</td>
      <td class="task-detail-column task-inline-cell" data-task-field="dependencies" tabindex="0">${dependencies?esc(dependencies):'<span class="muted">Keine</span>'}</td>
      <td class="task-table-actions"><button type="button" class="task-link-button" data-task-action="edit">Bearbeiten</button><button type="button" class="task-link-button delete" data-task-action="delete">Löschen</button></td>
    </tr>`;
  }).join('');
}

function handleTaskTableClick(e){
  const action=e.target.closest('[data-task-action]');
  if(action){
    const row=action.closest('[data-task-row-id]'); if(!row)return;
    if(action.dataset.taskAction==='edit')openTaskDialog(row.dataset.taskRowId);
    else if(action.dataset.taskAction==='delete')deleteTaskFromTable(row.dataset.taskRowId);
    return;
  }
  if(e.target.closest('a,button,input,select,textarea,label'))return;
  const cell=e.target.closest('td[data-task-field]');
  if(cell)openTaskInlineEditor(cell);
}

function handleTaskTableKeydown(e){
  if(e.target.closest('.task-inline-editor')){
    if(e.key==='Escape'){e.preventDefault();renderTaskTable();}
    return;
  }
  const cell=e.target.closest('td[data-task-field]');
  if(cell&&(e.key==='Enter'||e.key==='F2')){e.preventDefault();openTaskInlineEditor(cell);}
}

function openTaskInlineEditor(cell){
  if(cell.classList.contains('editing'))return;
  const row=cell.closest('[data-task-row-id]'), task=envelope.project.tasks.find(t=>String(t.id)===String(row?.dataset.taskRowId));
  if(!task)return;
  renderTaskTable();
  const fresh=$('taskTableBody').querySelector(`[data-task-row-id="${cssEscape(task.id)}"] td[data-task-field="${cell.dataset.taskField}"]`);
  if(!fresh)return;
  const field=fresh.dataset.taskField;
  fresh.classList.add('editing');
  fresh.removeAttribute('tabindex');
  fresh.innerHTML=`<div class="task-inline-editor" data-inline-task-id="${esc(task.id)}" data-inline-field="${esc(field)}">${taskInlineControl(field,task)}<span class="task-inline-actions"><button type="button" class="task-inline-save">✓</button><button type="button" class="task-inline-cancel">×</button></span></div>`;
  const editor=fresh.querySelector('.task-inline-editor');
  editor.querySelector('.task-inline-save').addEventListener('click',()=>saveTaskInlineEditor(editor));
  editor.querySelector('.task-inline-cancel').addEventListener('click',renderTaskTable);
  editor.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();renderTaskTable();}else if(e.key==='Enter'&&!e.shiftKey&&!e.target.matches('select[multiple]')){e.preventDefault();saveTaskInlineEditor(editor);}});
  const focus=editor.querySelector('input,select'); if(focus)focus.focus();
}

function taskInlineControl(field,task){
  const phases=envelope.project.planning?.phases||[];
  const option=(value,label,selected)=>`<option value="${esc(value)}" ${selected?'selected':''}>${esc(label)}</option>`;
  if(field==='name')return `<input data-inline-value type="text" maxlength="120" value="${esc(task.name)}">`;
  if(field==='phaseId')return `<select data-inline-value><option value="">Keine Phase</option>${phases.map(p=>option(p.id,p.name,String(p.id)===String(task.phaseId||''))).join('')}</select>`;
  if(field==='type')return `<select data-inline-value>${[['workstream','Arbeitspaket'],['critical','Kritisch markiert'],['milestone','Meilenstein'],['gate','Gate']].map(([v,l])=>option(v,l,task.type===v)).join('')}</select>`;
  if(field==='period')return `<div class="task-inline-period"><input data-inline-start type="date" value="${esc(task.start)}"><span>–</span><input data-inline-end type="date" value="${esc(task.end)}"></div>`;
  if(field==='progress')return `<input data-inline-value type="number" min="0" max="100" step="1" value="${clamp(Number(task.progress)||0,0,100)}">`;
  if(field==='owner')return `<input data-inline-value type="text" maxlength="80" value="${esc(task.owner||'')}">`;
  if(field==='status')return `<select data-inline-value>${[['neutral','Neutral'],['green','Grün'],['amber','Gelb'],['red','Rot']].map(([v,l])=>option(v,l,(task.status||'neutral')===v)).join('')}</select>`;
  if(field==='risk')return `<select data-inline-value>${[['none','Kein'],['low','Niedrig'],['medium','Mittel'],['high','Hoch'],['critical','Kritisch']].map(([v,l])=>option(v,l,(task.risk||'none')===v)).join('')}</select>`;
  if(field==='costEur')return `<input data-inline-value type="number" min="0" step="100" value="${Number(task.costEur)||0}">`;
  if(field==='dependencies')return `<select data-inline-value multiple size="4">${envelope.project.tasks.filter(t=>t.id!==task.id).map(t=>option(t.id,t.name,(task.dependencies||[]).includes(t.id))).join('')}</select>`;
  return '';
}

async function saveTaskInlineEditor(editor){
  const id=editor.dataset.inlineTaskId, field=editor.dataset.inlineField;
  const patch={};
  if(field==='period'){
    patch.start=editor.querySelector('[data-inline-start]').value;
    patch.end=editor.querySelector('[data-inline-end]').value;
  }else if(field==='dependencies')patch.dependencies=[...editor.querySelector('[data-inline-value]').selectedOptions].map(o=>o.value);
  else{
    const input=editor.querySelector('[data-inline-value]');
    let value=input.value;
    if(field==='progress')value=clamp(Number(value)||0,0,100);
    if(field==='costEur')value=Math.max(0,Number(value)||0);
    if(field==='name')value=value.trim().slice(0,120);
    if(field==='owner')value=value.trim().slice(0,80);
    patch[field]=value;
  }
  await updateTaskFromTable(id,patch);
}

async function updateTaskFromTable(id,patch){
  const idx=envelope.project.tasks.findIndex(t=>String(t.id)===String(id));
  if(idx<0)return;
  const next={...envelope.project.tasks[idx],...patch};
  if(!next.name?.trim())return toast('Der Aufgabenname darf nicht leer sein.',true);
  if(!next.start||!next.end||next.end<next.start)return toast('Der Zeitraum ist ungültig.',true);
  if((next.dependencies||[]).includes(next.id))return toast('Eine Aufgabe kann nicht von sich selbst abhängen.',true);
  const copy=envelope.project.tasks.map((t,i)=>i===idx?next:t);
  try{validateGraph(copy);}catch(e){return toast(e.message,true);}
  envelope.project.tasks=copy;
  sortTasks(); touch(); await persist(); await renderAll(); toast('Aufgabe aktualisiert.');
}

async function deleteTaskFromTable(id){
  const task=envelope.project.tasks.find(t=>String(t.id)===String(id)); if(!task)return;
  if(!confirm(`Aufgabe „${task.name}“ wirklich löschen?`))return;
  envelope.project.tasks=envelope.project.tasks.filter(t=>String(t.id)!==String(id)).map(t=>({...t,dependencies:(t.dependencies||[]).filter(dep=>String(dep)!==String(id))}));
  touch(); await persist(); await renderAll(); toast('Aufgabe gelöscht.');
}

function taskTypeLabel(type){return({workstream:'Arbeitspaket',critical:'Kritisch',milestone:'Meilenstein',gate:'Gate'})[type]||type||'–';}
function taskStatusLabel(status){return({neutral:'Neutral',green:'Grün',amber:'Gelb',red:'Rot'})[status]||'Neutral';}
function taskRiskLabel(risk){return({none:'Kein',low:'Niedrig',medium:'Mittel',high:'Hoch',critical:'Kritisch'})[risk]||'Kein';}
function cssEscape(value){return String(value).replace(/(["\\])/g,'\\$1');}
'''
          if 'function renderTaskTable()' not in s:
              anchor='function renderPlanningLists(){'
              if anchor not in s:
                  raise SystemExit('task table function anchor missing')
              s=s.replace(anchor,table_code+'\n'+anchor)

          app.write_text(s)
          PY

          cat > assets/css/task-table.css <<'EOF'
          /* Odin Aufgaben & Abhängigkeiten parity v1.5.0 */
          .task-overview-panel{margin-top:12px;overflow:hidden}.task-overview-header{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:17px 20px;border-bottom:1px solid var(--border);background:#fff}.task-overview-header h2{margin:0;color:var(--primary);font-size:18px}.task-overview-header p{margin:5px 0 0;color:var(--muted);font-size:11px}.task-overview-actions{display:flex;align-items:center;gap:8px}.task-details-toggle{min-width:132px}.task-table-wrap{overflow:auto}.task-overview-table{width:100%;min-width:1180px;border-collapse:collapse;background:#fff;table-layout:auto}.task-overview-table th{position:sticky;top:0;z-index:2;background:#f8fafb;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.45px;text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}.task-overview-table td{padding:10px 12px;border-bottom:1px solid #edf1f2;color:var(--ink);font-size:10px;vertical-align:middle}.task-overview-table tbody tr:hover{background:#fbfcfc}.task-overview-table.task-details-collapsed .task-detail-column{display:none}.task-inline-cell{cursor:pointer;transition:background .12s,border-color .12s}.task-inline-cell:hover{background:#f3f7f8}.task-inline-cell:focus{outline:2px solid color-mix(in srgb,var(--accent) 55%,white);outline-offset:-2px}.task-inline-cell>strong{display:block;color:var(--primary);font-size:11px}.task-table-note,.task-table-baseline{display:block;margin-top:3px;color:var(--muted);font-size:8px;line-height:1.35}.task-table-document{display:inline-block;margin-top:4px;color:var(--workstream);font-size:8px;text-decoration:none}.task-table-document:hover{text-decoration:underline}.task-period-cell{white-space:nowrap}.task-progress-cell{display:flex;align-items:center;gap:8px;min-width:105px}.task-progress-track{display:block;width:62px;height:5px;border-radius:999px;background:#e6ecee;overflow:hidden}.task-progress-track i{display:block;height:100%;background:var(--workstream)}.task-progress-cell b{font-size:9px;white-space:nowrap}.task-type-badge,.task-risk{display:inline-flex;align-items:center;border-radius:999px;padding:4px 7px;font-size:8px;font-weight:800;white-space:nowrap}.task-type-badge{background:#e8eef0;color:var(--primary)}.task-type-critical{background:#dfe7ef}.task-type-milestone{background:#e8efd3;color:#566f00}.task-type-gate{background:#f1e7dc;color:#81501f}.task-status{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}.task-status-dot{width:7px;height:7px;border-radius:50%;background:#b8c4c8}.task-status-dot.green{background:#4f8c57}.task-status-dot.amber{background:#c99b2e}.task-status-dot.red{background:#b14a4a}.task-risk-none{background:#edf1f2;color:#687d87}.task-risk-low{background:#e4efe3;color:#4c7548}.task-risk-medium{background:#f8ecd1;color:#8b6213}.task-risk-high{background:#f2dfd5;color:#9b5137}.task-risk-critical{background:#f3d9dc;color:#963440}.task-table-actions{white-space:nowrap}.task-link-button{border:0;background:transparent;color:var(--primary);font-size:9px;font-weight:800;padding:4px 5px;cursor:pointer}.task-link-button.delete{color:#a33}.task-table-empty{text-align:center!important;color:var(--muted)!important;padding:30px!important}.task-inline-cell.editing{padding:5px 7px;background:#f6fafb}.task-inline-editor{display:flex;align-items:center;gap:5px;min-width:150px}.task-inline-editor input,.task-inline-editor select{min-width:0;width:100%;padding:6px 7px;font-size:10px}.task-inline-editor select[multiple]{min-width:220px;min-height:86px}.task-inline-period{display:flex;align-items:center;gap:4px;min-width:240px}.task-inline-period input{width:112px}.task-inline-actions{display:inline-flex;gap:3px;flex:0 0 auto}.task-inline-actions button{width:25px;height:25px;border:1px solid var(--border);border-radius:4px;background:#fff;color:var(--primary);font-weight:900;cursor:pointer}.task-inline-actions button:first-child{background:#f4f9e8;border-color:#cadb9f;color:#5d7c00}@media(max-width:900px){.task-overview-header{align-items:flex-start;flex-direction:column}.task-overview-actions{width:100%;flex-wrap:wrap}}
          EOF

      - name: Validate application changes
        run: |
          node --check assets/js/app.js
          node --check assets/js/gantt.js
          test -s assets/css/task-table.css
          grep -q 'id="taskOverviewPanel"' index.html
          grep -q 'id="taskTableBody"' index.html
          grep -q 'assets/js/app.js?v=1.5.0' index.html
          grep -q 'task-table.css?v=1.5.0' index.html
          grep -q 'function renderTaskTable' assets/js/app.js
          grep -q 'function updateTaskFromTable' assets/js/app.js
          grep -q 'validateGraph(copy)' assets/js/app.js

      - name: Commit application changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/js/app.js assets/css/task-table.css
          git diff --cached --quiet && exit 0
          git commit -m 'Port Odin task and dependency table'
          git push
