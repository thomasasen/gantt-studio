name: Apply timeline overlap fix v1.4.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-timeline-overlap-v144.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix timeline header and marker label collisions
        run: |
          python - <<'PY'
          from pathlib import Path

          gantt = Path('assets/js/gantt.js')
          s = gantt.read_text()

          old_header = "function headerSegments(start,end,px,zoom){const result={major:[],minor:[]},total=Math.floor((end-start)/DAY)+1;if(zoom==='day'){for(let i=0;i<total;i++){const d=addDays(start,i);result.minor.push({left:i*px,width:px,label:fmtDate(d,{day:'2-digit'}),date:d});if(i===0||d.getUTCDate()===1)result.major.push({left:i*px,width:Math.min(31*px,(total-i)*px),label:fmtDate(d,{month:'long',year:'numeric'})});}}else if(zoom==='week'){for(let i=0;i<total;i++){const d=addDays(start,i);if(i===0||d.getUTCDay()===1)result.minor.push({left:i*px,width:Math.min(7*px,(total-i)*px),label:`KW ${weekNumber(d)}`,date:d});if(i===0||d.getUTCDate()<=7)result.major.push({left:i*px,width:Math.min(31*px,(total-i)*px),label:fmtDate(d,{month:'long',year:'numeric'})});}}else{for(let i=0;i<total;i++){const d=addDays(start,i);if(i===0||d.getUTCDate()===1)result.minor.push({left:i*px,width:Math.min(31*px,(total-i)*px),label:fmtDate(d,{month:'short'}),date:d});if(i===0||(d.getUTCMonth()===0&&d.getUTCDate()===1))result.major.push({left:i*px,width:Math.min(366*px,(total-i)*px),label:String(d.getUTCFullYear())});}}return result;}"

          new_header = r'''function periodWidth(periodStart,periodEnd,rangeStart,rangeEnd,px){
            const visibleStart=periodStart<rangeStart?rangeStart:periodStart;
            const visibleEnd=periodEnd>rangeEnd?rangeEnd:periodEnd;
            return (Math.floor((visibleEnd-visibleStart)/DAY)+1)*px;
          }
          function headerSegments(start,end,px,zoom){
            const result={major:[],minor:[]};
            if(zoom==='day'){
              const total=Math.floor((end-start)/DAY)+1;
              for(let i=0;i<total;i++){
                const d=addDays(start,i);
                result.minor.push({left:i*px,width:px,label:fmtDate(d,{day:'2-digit'}),date:d});
                if(i===0||d.getUTCDate()===1){
                  const monthStart=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),1));
                  const monthEnd=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0));
                  const visibleStart=monthStart<start?start:monthStart;
                  result.major.push({left:daysBetween(iso(start),iso(visibleStart))*px,width:periodWidth(monthStart,monthEnd,start,end,px),label:fmtDate(monthStart,{month:'long',year:'numeric'})});
                }
              }
              return result;
            }
            if(zoom==='week'){
              let cursor=new Date(start.getTime());
              while(cursor<=end){
                const weekStart=new Date(cursor.getTime());
                const day=weekStart.getUTCDay()||7;
                const weekEnd=addDays(weekStart,7-day);
                result.minor.push({left:daysBetween(iso(start),iso(weekStart))*px,width:periodWidth(weekStart,weekEnd,start,end,px),label:`KW ${weekNumber(weekStart)}`,date:weekStart});
                cursor=addDays(weekEnd,1);
              }
              let monthCursor=new Date(Date.UTC(start.getUTCFullYear(),start.getUTCMonth(),1));
              while(monthCursor<=end){
                const monthStart=new Date(monthCursor.getTime());
                const monthEnd=new Date(Date.UTC(monthCursor.getUTCFullYear(),monthCursor.getUTCMonth()+1,0));
                const visibleStart=monthStart<start?start:monthStart;
                result.major.push({left:daysBetween(iso(start),iso(visibleStart))*px,width:periodWidth(monthStart,monthEnd,start,end,px),label:fmtDate(monthStart,{month:'long',year:'numeric'})});
                monthCursor=new Date(Date.UTC(monthCursor.getUTCFullYear(),monthCursor.getUTCMonth()+1,1));
              }
              return result;
            }
            let monthCursor=new Date(Date.UTC(start.getUTCFullYear(),start.getUTCMonth(),1));
            while(monthCursor<=end){
              const monthStart=new Date(monthCursor.getTime());
              const monthEnd=new Date(Date.UTC(monthCursor.getUTCFullYear(),monthCursor.getUTCMonth()+1,0));
              const visibleStart=monthStart<start?start:monthStart;
              result.minor.push({left:daysBetween(iso(start),iso(visibleStart))*px,width:periodWidth(monthStart,monthEnd,start,end,px),label:fmtDate(monthStart,{month:'short'}),date:monthStart});
              monthCursor=new Date(Date.UTC(monthCursor.getUTCFullYear(),monthCursor.getUTCMonth()+1,1));
            }
            let yearCursor=new Date(Date.UTC(start.getUTCFullYear(),0,1));
            while(yearCursor<=end){
              const yearStart=new Date(yearCursor.getTime());
              const yearEnd=new Date(Date.UTC(yearCursor.getUTCFullYear(),11,31));
              const visibleStart=yearStart<start?start:yearStart;
              result.major.push({left:daysBetween(iso(start),iso(visibleStart))*px,width:periodWidth(yearStart,yearEnd,start,end,px),label:String(yearCursor.getUTCFullYear())});
              yearCursor=new Date(Date.UTC(yearCursor.getUTCFullYear()+1,0,1));
            }
            return result;
          }'''

          if old_header not in s:
              raise SystemExit('Expected headerSegments implementation not found')
          s = s.replace(old_header, new_header)

          old_lines = "  if(settings.showToday!==false)addVerticalLine(right,start,cfg.px,new Date(),'today-line','today-label','Heute',timelineWidth,totalHeight);\n  (project.planning?.markers||[]).forEach(marker=>{if(!marker.date)return;const line=addVerticalLine(right,start,cfg.px,toDate(marker.date),'marker-line','marker-label',marker.name||'Marker',timelineWidth,totalHeight,marker.color);if(line)line.style.borderLeftStyle=marker.style==='solid'?'solid':marker.style==='dotted'?'dotted':'dashed';});\n  if(settings.showRelativeToday&&Number.isFinite(Number(settings.relativeOffsetDays))){const relativeIso=calculateRelativeDate(settings,project.planning?.holidays||[]);const line=addVerticalLine(right,start,cfg.px,toDate(relativeIso),'marker-line relative-today-line','marker-label',`${relativeLabel(settings)} · ${fmtDate(toDate(relativeIso),{day:'2-digit',month:'2-digit',year:'numeric'})}`,timelineWidth,totalHeight,settings.relativeColor);if(line){line.style.borderLeftStyle=settings.relativeStyle==='solid'?'solid':settings.relativeStyle==='dotted'?'dotted':'dashed';line.dataset.relativeTarget=relativeIso;}}"

          new_lines = r'''  const lineItems=[];
          if(settings.showToday!==false)lineItems.push({date:new Date(),lineClass:'today-line',labelClass:'today-label',label:'Heute'});
          (project.planning?.markers||[]).forEach(marker=>{if(marker.date)lineItems.push({date:toDate(marker.date),lineClass:'marker-line',labelClass:'marker-label',label:marker.name||'Marker',color:marker.color,style:marker.style});});
          if(settings.showRelativeToday&&Number.isFinite(Number(settings.relativeOffsetDays))){
            const relativeIso=calculateRelativeDate(settings,project.planning?.holidays||[]);
            lineItems.push({date:toDate(relativeIso),lineClass:'marker-line relative-today-line',labelClass:'marker-label',label:`${relativeLabel(settings)} · ${fmtDate(toDate(relativeIso),{day:'2-digit',month:'2-digit',year:'numeric'})}`,color:settings.relativeColor,style:settings.relativeStyle,relativeTarget:relativeIso});
          }
          const labelLanes=[];
          lineItems.sort((a,b)=>a.date-b.date).forEach(item=>{
            const line=addVerticalLine(right,start,cfg.px,item.date,item.lineClass,item.labelClass,item.label,timelineWidth,totalHeight,item.color,labelLanes);
            if(!line)return;
            if(item.style)line.style.borderLeftStyle=item.style==='solid'?'solid':item.style==='dotted'?'dotted':'dashed';
            if(item.relativeTarget)line.dataset.relativeTarget=item.relativeTarget;
          });'''

          if old_lines not in s:
              raise SystemExit('Expected vertical line rendering block not found')
          s = s.replace(old_lines, new_lines)

          old_vertical = "function addVerticalLine(parent,start,px,date,lineClass,labelClass,label,width,height,color){const utc=new Date(Date.UTC(date.getUTCFullYear?.()??date.getFullYear(),date.getUTCMonth?.()??date.getMonth(),date.getUTCDate?.()??date.getDate()));const pos=Math.floor((utc-start)/DAY)*px;if(pos<0||pos>width)return null;const line=el('div',lineClass);line.style.left=`${pos}px`;line.style.top='56px';line.style.height=`${height-56}px`;if(color)line.style.borderLeftColor=color;const lab=el('span',labelClass,label);if(color)lab.style.color=color;line.appendChild(lab);parent.appendChild(line);return line;}"

          new_vertical = r'''function addVerticalLine(parent,start,px,date,lineClass,labelClass,label,width,height,color,labelLanes=[]){
            const utc=new Date(Date.UTC(date.getUTCFullYear?.()??date.getFullYear(),date.getUTCMonth?.()??date.getMonth(),date.getUTCDate?.()??date.getDate()));
            const pos=Math.floor((utc-start)/DAY)*px;
            if(pos<0||pos>width)return null;
            const line=el('div',lineClass);
            line.style.left=`${pos}px`;line.style.top='56px';line.style.height=`${height-56}px`;
            if(color)line.style.borderLeftColor=color;
            const lab=el('span',labelClass,label);
            if(color)lab.style.color=color;
            const approxWidth=Math.min(220,Math.max(72,String(label).length*6+18));
            let lane=0;
            while(lane<labelLanes.length&&pos<labelLanes[lane]+18)lane++;
            lane=Math.min(lane,2);
            labelLanes[lane]=Math.max(labelLanes[lane]||0,pos+approxWidth);
            lab.style.top=`${4+lane*15}px`;
            lab.style.maxWidth=`${approxWidth}px`;
            line.appendChild(lab);parent.appendChild(line);return line;
          }'''

          if old_vertical not in s:
              raise SystemExit('Expected addVerticalLine implementation not found')
          s = s.replace(old_vertical, new_vertical)
          gantt.write_text(s)

          css = Path('assets/css/app.css')
          c = css.read_text()
          old_major = ".time-major { position: absolute; top: 0; height: 28px; border-left: 1px solid var(--border); display: flex; align-items: center; padding-left: 7px; color: var(--primary); font-size: 10px; font-weight: 800; white-space: nowrap; }"
          new_major = ".time-major { position: absolute; top: 0; height: 28px; border-left: 1px solid var(--border); display: flex; align-items: center; padding: 0 6px 0 7px; color: var(--primary); font-size: 10px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-sizing: border-box; }"
          old_minor = ".time-minor { position: absolute; top: 28px; height: 28px; border-left: 1px solid var(--grid); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 9px; }"
          new_minor = ".time-minor { position: absolute; top: 28px; height: 28px; border-left: 1px solid var(--grid); display: flex; align-items: center; justify-content: center; padding: 0 4px; color: var(--muted); font-size: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-sizing: border-box; }"
          old_marker = ".marker-label, .today-label { position: sticky; top: 4px; transform: translateX(4px); display: inline-block; background: rgba(255,255,255,.92); padding: 2px 4px; border-radius: 3px; font-size: 8px; font-weight: 800; white-space: nowrap; }"
          new_marker = ".marker-label, .today-label { position: absolute; left: 0; top: 4px; transform: translateX(4px); display: inline-block; background: rgba(255,255,255,.94); padding: 2px 4px; border: 1px solid rgba(216,225,228,.75); border-radius: 3px; font-size: 8px; font-weight: 800; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; z-index: 2; }"
          for old,new,name in [(old_major,new_major,'time-major'),(old_minor,new_minor,'time-minor'),(old_marker,new_marker,'marker-label')]:
              if old not in c:
                  raise SystemExit(f'Expected CSS rule not found: {name}')
              c = c.replace(old,new)
          css.write_text(c)

          app = Path('assets/js/app.js')
          a = app.read_text().replace("./gantt.js?v=1.4.3", "./gantt.js?v=1.4.4")
          app.write_text(a)

          index = Path('index.html')
          h = index.read_text().replace('?v=1.4.3','?v=1.4.4')
          index.write_text(h)
          PY
      - name: Validate patch
        run: |
          node --check assets/js/app.js
          node --check assets/js/gantt.js
          grep -q "gantt.js?v=1.4.4" assets/js/app.js
          grep -q "app.js?v=1.4.4" index.html
          grep -q "function periodWidth" assets/js/gantt.js
          grep -q "const labelLanes=\[\]" assets/js/gantt.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/gantt.js assets/js/app.js assets/css/app.css index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix timeline label overlaps'
          git push
