name: Validate Gantt Studio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/app.js
          node --check assets/js/gantt.js
          node --check assets/js/storage.js
      - name: Check required static files
        run: |
          test -s index.html
          test -s assets/css/app.css
          test -s assets/css/privacy.css
          test -s assets/css/odin.css
          test -s assets/css/scroll-fix.css
          test -s assets/css/task-table.css
          test -s examples/demo.gantt.json
          python -m json.tool examples/demo.gantt.json >/dev/null
          grep -q 'assets/js/app.js?v=1.5.0' index.html
          grep -q 'assets/css/app.css?v=1.4.4' index.html
          grep -q 'assets/css/privacy.css?v=1.4.4' index.html
          grep -q 'assets/css/odin.css?v=1.4.4' index.html
          grep -q 'assets/css/scroll-fix.css?v=1.4.5' index.html
          grep -q 'assets/css/task-table.css?v=1.5.1' index.html
          grep -q 'Readability scale v1.4.2' assets/css/odin.css
          grep -q 'Clickable phase rows v1.4.3' assets/css/odin.css
          grep -q "gantt.js?v=1.4.4" assets/js/app.js
          grep -q 'function periodWidth' assets/js/gantt.js
          grep -q 'const labelLanes=\[\]' assets/js/gantt.js
          grep -q 'text-overflow: ellipsis' assets/css/app.css
          grep -q 'dataset.phaseId' assets/js/gantt.js
          grep -q 'Deine Projekt- und Planungsdaten bleiben in diesem Browser' index.html
          grep -q 'phaseCollapseToolbar' index.html
          grep -q 'centralExportBtn' index.html
          grep -q 'designBtn' index.html
          grep -q 'data-management-mode="management"' index.html
          grep -q 'data-zoom="week"' index.html
          grep -q 'Dynamische Zieldatumslinie' index.html
          grep -q 'relativeTargetDate' index.html
          grep -q 'relativeSkipHolidays' index.html
          grep -q 'displayActiveCount' index.html
          grep -q 'phaseCountBadge' index.html
          grep -q 'markerCountBadge' index.html
          grep -q 'holidayCountBadge' index.html
          grep -q 'showDependencies' assets/js/app.js
          grep -q 'makeStatusLine' assets/js/gantt.js
          grep -q 'const DAY = 86400000' assets/js/app.js
          grep -q 'guide-baseline-symbol' index.html
          grep -q 'guide-buffer-symbol' index.html
          grep -q 'guide-status-symbol' index.html
          grep -q 'guide-dependency-symbol' index.html
          grep -q 'id="taskOverviewPanel"' index.html
          grep -q 'id="taskTableBody"' index.html
          grep -q 'id="taskDetailsToggle"' index.html
          grep -q 'function renderTaskTable' assets/js/app.js
          grep -q 'function updateTaskFromTable' assets/js/app.js
          grep -q 'validateGraph(copy)' assets/js/app.js
          grep -q 'const documentUrl=safeUrl(task.url)' assets/js/app.js
          grep -q 'font-size:13px' assets/css/task-table.css
          grep -q 'font-size:11px' assets/css/task-table.css
