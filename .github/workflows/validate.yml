name: Validate Gantt Studio

on:
  push:
    branches: [main, refactor/engine-abstraction, spike/frappe-gantt-adapter]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/app.js
          node --check assets/js/icons.mjs
          node --check assets/js/design-presets.mjs
          node --check assets/js/gantt.js
          node --check assets/js/core/date-only.mjs
          node --check assets/js/core/project-commits.mjs
          node --check assets/js/engine/engine-contract.mjs
          node --check assets/js/engine/engine-controller.mjs
          node --check assets/js/engine/native/native-adapter.mjs
          node --check assets/js/engine/native/native-interactions.mjs
          node --check assets/js/engine/frappe/frappe-task-mapper.mjs
          node --check assets/js/engine/frappe/frappe-adapter.mjs
          node --check tests/frappe-spike.spec.mjs
          node --check spikes/frappe/spike.mjs
          node --check spikes/frappe/build.mjs
          node --check assets/js/storage.js
      - name: Run isolated Frappe adapter contract tests
        run: node --test tests/frappe-spike.spec.mjs
      - name: Check required static files
        run: |
          test -s index.html
          test -s assets/css/app.css
          test -s assets/css/privacy.css
          test -s assets/css/odin.css
          test -s assets/css/scroll-fix.css
          test -s assets/css/task-table.css
          test -s assets/css/design-system.css
          test -s assets/js/core/date-only.mjs
          test -s assets/js/core/project-commits.mjs
          test -s assets/js/engine/engine-contract.mjs
          test -s assets/js/engine/engine-controller.mjs
          test -s assets/js/engine/native/native-adapter.mjs
          test -s assets/js/engine/native/native-interactions.mjs
          test -s assets/js/icons.mjs
          test -s docs/icon-system.md
          test -s tests/ui.spec.cjs
          test -s playwright.config.cjs
          test -s examples/demo.gantt.json
          python -m json.tool examples/demo.gantt.json >/dev/null
          grep -q 'assets/js/app.js?v=2.8.0' index.html
          grep -q 'assets/css/app.css?v=1.4.4' index.html
          grep -q 'assets/css/privacy.css?v=1.4.4' index.html
          grep -q 'assets/css/odin.css?v=1.4.4' index.html
          grep -q 'assets/css/scroll-fix.css?v=1.4.5' index.html
          grep -q 'assets/css/task-table.css?v=1.5.1' index.html
          grep -q 'assets/css/design-system.css?v=2.6.0' index.html
          grep -q 'Readability scale v1.4.2' assets/css/odin.css
          grep -q 'Clickable phase rows v1.4.3' assets/css/odin.css
          grep -q "native-adapter.mjs?v=2.8.0" assets/js/app.js
          grep -q "gantt.js?v=2.8.0" assets/js/engine/native/native-adapter.mjs
          grep -q "storage.js?v=2.8.0" assets/js/app.js
          grep -q "task-order.mjs?v=2.8.0" assets/js/app.js
          grep -q "design-presets.mjs?v=2.8.0" assets/js/app.js
          grep -q 'icons.mjs?v=2.8.0' assets/js/app.js
          grep -q 'icons.mjs?v=2.8.0' assets/js/gantt.js
          grep -q 'function periodWidth' assets/js/gantt.js
          grep -q 'const labelLanes=\[\]' assets/js/gantt.js
          grep -q 'text-overflow: ellipsis' assets/css/app.css
          grep -q 'dataset.phaseId' assets/js/gantt.js
          grep -q 'Deine Projekt- und Planungsdaten bleiben in diesem Browser' index.html
          grep -q 'phaseCollapseToolbar' index.html
          grep -q 'centralExportBtn' index.html
          grep -q 'designBtn' index.html
          grep -q 'data-management-mode="management"' index.html
          grep -q 'data-zoom="week"' index.html
          grep -q 'Dynamische Zieldatumslinie' index.html
          grep -q 'relativeTargetDate' index.html
          grep -q 'relativeSkipHolidays' index.html
          grep -q 'displayActiveCount' index.html
          grep -q 'phaseCountBadge' index.html
          grep -q 'markerCountBadge' index.html
          grep -q 'holidayCountBadge' index.html
          grep -q 'showDependencies' assets/js/app.js
          grep -q 'makeStatusLine' assets/js/gantt.js
          grep -q 'const DAY = 86400000' assets/js/app.js
          grep -q 'guide-baseline-symbol' index.html
          grep -q 'guide-buffer-symbol' index.html
          grep -q 'guide-status-symbol' index.html
          grep -q 'guide-dependency-symbol' index.html
          grep -q 'id="taskOverviewPanel"' index.html
          grep -q 'id="taskTableBody"' index.html
          grep -q 'id="taskDetailsToggle"' index.html
          grep -q 'function renderTaskTable' assets/js/app.js
          grep -q 'function updateTaskFromTable' assets/js/app.js
          grep -q 'validateGraph(copy)' assets/js/app.js
          grep -q 'const documentUrl=safeUrl(task.url)' assets/js/app.js
          grep -q 'font-size:13px' assets/css/task-table.css
          grep -q 'font-size:11px' assets/css/task-table.css

  refresh-frappe-lockfile:
    if: github.ref == 'refs/heads/spike/frappe-gantt-adapter' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recreate npm-managed lockfile with registry integrity
        run: |
          rm spikes/frappe/package-lock.json
          npm install --package-lock-only --prefix spikes/frappe --ignore-scripts --no-audit --no-fund
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const lock=JSON.parse(readFileSync('spikes/frappe/package-lock.json','utf8'));
          const pkg=lock.packages?.['node_modules/frappe-gantt'];
          if(pkg?.version!=='1.2.2'||!pkg.integrity?.startsWith('sha512-'))
            throw new Error('npm integrity hash missing from generated lockfile.');
          console.log('npm-generated SRI verified: '+pkg.integrity);
          JS
      - name: Commit generated lockfile only when changed
        run: |
          if ! git diff --quiet -- spikes/frappe/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add spikes/frappe/package-lock.json
            git commit -m "build(spike): regenerate npm lockfile with registry integrity"
            git push origin HEAD:spike/frappe-gantt-adapter
          fi
