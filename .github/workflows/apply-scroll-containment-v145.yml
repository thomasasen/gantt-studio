name: Apply Gantt scroll containment fix v1.4.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-scroll-containment-v145.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add scroll containment styles
        run: |
          cat > assets/css/scroll-fix.css <<'EOF'
          /* Gantt scroll containment v1.4.5
             Sticky date headers must remain inside the Gantt viewport and
             never paint over the timeline controls, phase toolbar or left headings. */

          .workspace {
            position: relative;
            isolation: isolate;
          }

          .timeline-panel-head {
            position: relative;
            z-index: 50;
            background: var(--panel);
          }

          .phase-collapse-toolbar {
            position: relative;
            z-index: 45;
            background: #f8fafb;
          }

          .gantt-scroller {
            position: relative;
            z-index: 1;
            isolation: isolate;
          }

          /* The frozen left side must always cover timeline content when
             horizontal scrolling brings the timeline underneath it. */
          .gantt-left {
            z-index: 30;
          }

          .gantt-head-left {
            z-index: 40;
            background: #f8fafb;
          }

          .gantt-head-right {
            z-index: 20;
            background: #f8fafb;
          }

          /* A small separator makes the sticky header boundary explicit. */
          .gantt-head-left,
          .gantt-head-right {
            box-shadow: 0 1px 0 var(--border);
          }
          EOF

          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          link = '  <link rel="stylesheet" href="./assets/css/scroll-fix.css?v=1.4.5">\n'
          if 'assets/css/scroll-fix.css' not in s:
              anchor = '  <link rel="stylesheet" href="./assets/css/odin.css?v=1.4.4">\n'
              if anchor not in s:
                  raise SystemExit('odin.css link anchor not found')
              s = s.replace(anchor, anchor + link)
          p.write_text(s)
          PY

      - name: Validate
        run: |
          test -s assets/css/scroll-fix.css
          grep -q 'scroll-fix.css?v=1.4.5' index.html
          grep -q 'gantt-head-left' assets/css/scroll-fix.css
          grep -q 'gantt-head-right' assets/css/scroll-fix.css
          grep -q 'phase-collapse-toolbar' assets/css/scroll-fix.css

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/css/scroll-fix.css
          git diff --cached --quiet && exit 0
          git commit -m 'Contain sticky Gantt headers while scrolling'
          git push
