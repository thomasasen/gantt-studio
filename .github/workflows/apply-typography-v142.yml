name: Apply typography v1.4.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-typography-v142.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply typography and cache busting
        run: |
          python -c 'from pathlib import Path; p=Path("index.html"); s=p.read_text(); s=s.replace("app.css?v=1.4.0","app.css?v=1.4.2").replace("privacy.css?v=1.4.0","privacy.css?v=1.4.2").replace("odin.css?v=1.4.0","odin.css?v=1.4.2").replace("app.js?v=1.4.0","app.js?v=1.4.2").replace("app.css?v=1.4.1","app.css?v=1.4.2").replace("privacy.css?v=1.4.1","privacy.css?v=1.4.2").replace("odin.css?v=1.4.1","odin.css?v=1.4.2").replace("app.js?v=1.4.1","app.js?v=1.4.2"); p.write_text(s)'
          python -c 'import base64; from pathlib import Path; p=Path("assets/css/odin.css"); s=p.read_text(); css=base64.b64decode("").decode(); p.write_text(s if "Readability scale v1.4.2" in s else s+css)'
      - name: Validate patch
        run: |
          grep -q 'odin.css?v=1.4.2' index.html
          grep -q 'Readability scale v1.4.2' assets/css/odin.css
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/css/odin.css
          git diff --cached --quiet && exit 0
          git commit -m 'Improve typography readability and bust CSS cache'
          git push
