name: Apply typography v1.4.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-typography-v142.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply cache busting and stronger typography
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()
          for old in ['1.4.0','1.4.1']:
              s = s.replace(f'app.css?v={old}', 'app.css?v=1.4.2')
              s = s.replace(f'privacy.css?v={old}', 'privacy.css?v=1.4.2')
              s = s.replace(f'odin.css?v={old}', 'odin.css?v=1.4.2')
              s = s.replace(f'app.js?v={old}', 'app.js?v=1.4.2')
          p.write_text(s)

          p = Path('assets/css/odin.css')
          s = p.read_text()
          marker = '/* Readability scale v1.4.2 */'
          if marker not in s:
              s += r'''

/* Readability scale v1.4.2 */
/* Clearly larger desktop typography while preserving the compact Odin layout. */
.planning-page-head h1{font-size:24px}
.planning-page-head p{font-size:13px;line-height:1.45}
.planning-cost-card span{font-size:10px}
.planning-cost-card strong{font-size:19px}
.planning-accordion>summary>span:first-child strong{font-size:14px;line-height:1.25}
.planning-accordion>summary>span:first-child small{font-size:11px;line-height:1.4;margin-top:4px}
.planning-count-badge{font-size:10px;padding:5px 9px}
.planning-toggle-grid .toggle-row{font-size:12px;line-height:1.3;padding:10px 11px}
.planning-toggle-grid .toggle-row input{width:16px;height:16px}
.relative-editor-head h3{font-size:14px}
.relative-editor-head p{font-size:11px;line-height:1.45}
.switch-label{font-size:12px}
.relative-editor-grid>label{font-size:11px;line-height:1.3}
.relative-editor-grid input,.relative-editor-grid select{font-size:12px;min-height:38px}
.input-suffix span{font-size:11px}
.relative-skip-row{font-size:11px!important;line-height:1.4}
.relative-result-row span{font-size:9px}
.relative-result-row strong{font-size:12px}
.planning-note{font-size:11px}
.entity-row strong{font-size:12px}
.entity-row small{font-size:10px}
.muted-empty{font-size:11px}
.btn.small{font-size:12px}
.studio-tab{font-size:13px}
.save-status{font-size:11px}
.text-action{font-size:11px}
.project-head-side{font-size:12px}
.control-caption{font-size:10px}
.seg-btn,.task-count,.dropdown-control>summary{font-size:11px}
.filter-panel strong{font-size:12px}
.filter-panel label,.quick-settings label{font-size:12px}
.phase-collapse-heading strong{font-size:12px}
.phase-collapse-heading span{font-size:10px}
.phase-collapse-button{font-size:11px}
.phase-collapse-count{font-size:10px}
.task-title strong{font-size:12px}
.task-title small,.owner{font-size:10px}
.status-pill{font-size:9px}
.time-major{font-size:11px}
.time-minor{font-size:10px}
.bar-label{font-size:10px}
.marker-label,.today-label{font-size:9px}
@media(max-width:1250px){
  .planning-toggle-grid .toggle-row{font-size:12px}
  .relative-editor-grid>label{font-size:11px}
}
'''
          p.write_text(s)
          PY
      - name: Validate patch
        run: |
          grep -q 'odin.css?v=1.4.2' index.html
          grep -q 'Readability scale v1.4.2' assets/css/odin.css
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/css/odin.css
          git diff --cached --quiet && exit 0
          git commit -m 'Improve typography readability and bust CSS cache'
          git push
